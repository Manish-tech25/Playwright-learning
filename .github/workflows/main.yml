on: [push, pull_request]
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
 
      - name: Install dependencies
        run: npm install
 
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
 
      - name: Run tests
        run: npm test
